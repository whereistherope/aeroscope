name: AeroScope Preview

on:
  push:
    branches:
      - feat/v1-refresh
    paths:
      - 'web/**'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload AeroScope web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
